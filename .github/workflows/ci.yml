name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the history scan reads every commit
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No OpenDART key, model server, or cache here: cache-backed tests skip,
      # and the demo replays recorded responses and model readings.
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Replay demo
        run: python -m dart_review demo > /dev/null
      - name: Public safety scan (current files)
        run: python scripts/check_public_safety.py
      - name: Public safety scan (whole git history)
        run: python scripts/check_history_safety.py
