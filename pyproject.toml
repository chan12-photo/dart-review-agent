[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dart-review-agent"
version = "0.1.2"
description = "Compare Korean listed companies' financial figures across periods from OpenDART with comparability checks"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
# documents to verified spreadsheets (dart_review.documents); OCR also needs the tesseract program with kor data
docs = ["pdfplumber>=0.11", "pypdfium2>=4", "openpyxl>=3.1", "pillow>=10"]
# the local HTTP API and upload page: python -m dart_review serve
server = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
include = ["dart_review*"]

[tool.setuptools.package-data]
dart_review = ["*.json", "upload.html", "documents/vision_ocr.swift"]
